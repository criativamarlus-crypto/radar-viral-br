# Cole esta linha no CloudPanel: Sites > viral.netnewsltda.online > Vhost, logo depois da linha "server {" (a primeira do bloco principal).
#
# Descoberta OAuth (necessária para conectar o ChatGPT): sem ela o Nginx devolve 404 para /.well-known/oauth-*.
rewrite ^/\.well-known/(oauth-protected-resource|oauth-authorization-server|openid-configuration)(?:/.*)?$ /oauth-metadata.php?doc=$1 last;

# O IP real do visitante atrás da Cloudflare NÃO precisa mais de configuração aqui: o app lê o CF-Connecting-IP
# sozinho, e somente quando a conexão vem de uma faixa oficial da Cloudflare (app/clientip.php).
