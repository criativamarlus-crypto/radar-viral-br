# Review in CloudPanel's vhost editor. This is an include/snippet, NOT a complete
# server block and must not replace CloudPanel's SSL or PHP-FPM configuration.
# root must resolve to /absolute/site/path/current/public;

client_max_body_size 6m;
autoindex off;

# Files beneath storage are served only by authenticated media.php.
location ^~ /uploads/ { return 404; }

# Defense in depth if an incorrect document root is accidentally configured.
location ~* ^/(?:app|storage|bin|tests|deploy|docs|vendor)(?:/|$) { return 404; }
location ~* ^/(?:config(?:\.example)?\.php|AGENTS\.md|README\.md)$ { return 404; }
location ~ /\.(?!well-known(?:/|$)) { return 404; }

# Add `try_files $uri =404;` inside CloudPanel's EXISTING PHP location.
# Never add a second conflicting PHP-FPM handler or allow path-info execution.
# Add `fastcgi_hide_header X-Powered-By;` to that existing FastCGI handler.
# Add `fastcgi_param HTTP_AUTHORIZATION $http_authorization;` to that existing
# handler so the authenticated API/MCP receives the Bearer header under PHP-FPM.
# Ensure PHP-FPM user can read release files and write shared/storage.
